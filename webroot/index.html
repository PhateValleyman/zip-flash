<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIP & Module Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="header">
<h1>⚡ ZIP & Module Manager</h1>
<button class="theme-btn" onclick="toggleTheme()">🌓</button>
<div id="spinner" class="spinner" style="display:none" aria-hidden="true" title="Pracuje..."></div>
</div>

<div class="card">
<h2>Restart Zařízení</h2>
<div class="reboot-grid">
    <button onclick="reboot('system')" style="background: #3b82f6;">🔄 System</button>
    <button onclick="reboot('recovery')" style="background: #8b5cf6;">🛠️ Recovery</button>
    <button onclick="reboot('bootloader')" style="background: #f59e0b;">⚡ Bootloader</button>
</div>
</div>

<div class="card">
<h2>Instalovat ZIP / Modul</h2>
<select id="fileSelect" onchange="updateSelection()">
    <option value="">-- Vyberte ZIP --</option>
</select>
<button onclick="scanFiles()" style="margin-top: 10px; background: #444;">🔄 Obnovit seznam ZIPů</button>
<div style="margin-top: 10px;">
    <label><input id="nosystem" type="checkbox"> NOSYSTEM</label>
    <label><input id="debug" type="checkbox"> DEBUG</label>
    <label><input id="rw" type="checkbox"> SYSTEM_MODE=rw</label>
</div>
<button class="flash" onclick="flash()" style="margin-top: 10px;">⚡ FLASH ZIP</button>
</div>

<div class="card">
<h2>Nainstalované Moduly</h2>
<button onclick="loadModules()" style="margin-bottom: 10px; background: #444;">🔄 Obnovit moduly</button>
<div id="moduleList">Načítání...</div>
</div>

<div class="card">
<h2>LOG</h2>
<pre id="log"></pre>
</div>
</div>
<script src="index.js"></script>
</body>
</html>
